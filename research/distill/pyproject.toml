[project]
name = "bonsai-distill"
version = "0.1.0"
description = "Distilling the Bonsai context compiler into a 0.5B-1.5B student: base vs SFT vs on-policy GKD, graded on BriefBench-style entity-presence checks"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.46",
    "trl>=1.0.0",
    "datasets>=3.0",
    "accelerate>=1.0",
    "peft>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bonsai_distill"]
