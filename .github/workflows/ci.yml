name: ci

on:
  push:
    branches: [main, copy-a, copy-b]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc --noEmit --project extension/tsconfig.json
      - run: node extension/build.mjs
      # Strangers install from the committed bundles without building — CI proves the committed
      # dist matches a fresh build of src (maps are gitignored; diff only the tracked .js).
      - name: extension dist in sync with src
        run: git diff --exit-code -- extension/dist/*.js
      - name: plugin MCP smoke + dist in sync
        # plugin/mcp is deliberately not a workspace (marketplace clones run the bundled dist);
        # its own deps must be installed before the smoke can spawn server.mjs from source.
        run: |
          npm ci --prefix plugin/mcp
          node plugin/mcp/smoke.mjs
          node plugin/mcp/build.mjs
          git diff --exit-code -- plugin/mcp/dist/server.mjs
      - run: npm run test
      # No keys in CI: evals run against the mock, gating plumbing + routing thresholds.
      - run: npm run eval
      - run: npm run build
      # Publish smoke: build the standalone dist and prove the ESM artifact loads with its exports.
      - name: engine dist build + ESM load smoke
        working-directory: packages/engine
        run: |
          npx tsup
          node -e "import('./dist/index.js').then(m => { if (typeof m.compileBrief !== 'function' || typeof m.setEngineLogger !== 'function') throw new Error('dist artifact missing exports'); console.log('engine dist ESM load ok'); }).catch(e => { console.error(e); process.exit(1); })"
